[project]
name = "sal-portolan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "portolan-cli",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pyld>=2.0",
    "pyright>=1.1",
    "pytest>=8.0",
]

[tool.pyright]
include = ["main.py", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
